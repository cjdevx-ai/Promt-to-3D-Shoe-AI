steps:
  # Build Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/shoe-ai-backend', './backend']
    id: 'build-backend'

  # Build Frontend Image
  # We pass VITE_API_URL as a build argument so it gets baked into the static files
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/shoe-ai-frontend'
      - '--build-arg'
      - 'VITE_API_URL=${_VITE_API_URL}'
      - './frontend'
    id: 'build-frontend'

images:
  - 'gcr.io/$PROJECT_ID/shoe-ai-backend'
  - 'gcr.io/$PROJECT_ID/shoe-ai-frontend'

substitutions:
  _VITE_API_URL: 'https://backend-placeholder.a.run.app' # Replace with your actual backend URL after first deploy

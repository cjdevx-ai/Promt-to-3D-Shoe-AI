steps:
  # 1. Build Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/shoe-ai-backend', './backend']
    id: 'build-backend'

  # 2. Build Frontend Image
  # VITE_API_URL is baked in at build time
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/shoe-ai-frontend'
      - '--build-arg'
      - 'VITE_API_URL=${_VITE_API_URL}'
      - './frontend'
    id: 'build-frontend'

  # 3. Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'shoe-ai-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/shoe-ai-backend'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'STABILITY_API_KEY=${_STABILITY_API_KEY}'
    id: 'deploy-backend'

  # 4. Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'shoe-ai-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/shoe-ai-frontend'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
    id: 'deploy-frontend'

images:
  - 'gcr.io/$PROJECT_ID/shoe-ai-backend'
  - 'gcr.io/$PROJECT_ID/shoe-ai-frontend'

substitutions:
  _VITE_API_URL: 'https://shoe-ai-api-placeholder.a.run.app'
  _STABILITY_API_KEY: 'your-api-key-here'

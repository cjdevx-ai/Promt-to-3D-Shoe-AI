steps:
  # 1. Build the Monolith Image (Frontend + Backend)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/shoe-ai-monolith', '.']
    id: 'build-monolith'

  # 2. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'shoe-ai-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/shoe-ai-monolith'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'STABILITY_API_KEY=${_STABILITY_API_KEY}'
    id: 'deploy-monolith'

images:
  - 'gcr.io/$PROJECT_ID/shoe-ai-monolith'

substitutions:
  _STABILITY_API_KEY: 'your-api-key-here'
